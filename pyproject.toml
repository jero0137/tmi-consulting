[project]
name = "data-jobs-pipeline"
version = "0.1.0"
description = "ELT pipeline — job postings CSV → PostgreSQL → dbt 3NF model"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "great-expectations>=1.0",
    "lingua-language-detector>=2.1.1",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
norecursedirs = ["airflow", ".venv", ".git"]
