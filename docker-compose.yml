version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  env_file: .env
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@postgres_airflow:5432/${AIRFLOW_POSTGRES_DB}"
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # PRINCIPAL DATABASE CONNECTION
    PIPELINE_DB_CONN: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
  volumes:
    - ./airflow/dags:/opt/airflow/dags      
    - ./airflow/logs:/opt/airflow/logs       
    - ./pipeline:/opt/airflow/pipeline       
    - ./dbt:/opt/airflow/dbt                 
    - ./data:/opt/airflow/data               
    - ./.env:/opt/airflow/.env               
  depends_on:
    postgres_airflow:
      condition: service_healthy
    postgres_data:
      condition: service_healthy
  networks:
    - pipeline_net

services:

  # ================================================================
  # PRINCIPAL DATABASE
  # ================================================================
  postgres_data:
    image: postgres:16-alpine
    container_name: postgres_data
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pipeline_net
    restart: unless-stopped

  # ================================================================
  # AIRFLOW METADATA DB
  # ================================================================
  postgres_airflow:
    image: postgres:16-alpine
    container_name: postgres_airflow
    env_file: .env
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - postgres_airflow_vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_POSTGRES_USER}", "-d", "${AIRFLOW_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pipeline_net
    restart: unless-stopped

  # ================================================================
  # AIRFLOW INIT
  # ================================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL} || true"
    restart: "no"

  # ================================================================
  # AIRFLOW SCHEDULER
  # ================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ================================================================
  # AIRFLOW WEBSERVER
  # ================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-scheduler:
        condition: service_healthy
    restart: unless-stopped

# ================================================================
# VOLUMES
# ================================================================
volumes:
  postgres_data_vol:
    name: data_jobs_postgres_data
  postgres_airflow_vol:
    name: data_jobs_postgres_airflow

# ================================================================
# NETWORK
# ================================================================
networks:
  pipeline_net:
    name: data_jobs_network
    driver: bridge
